services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nthub_local}
      POSTGRES_DB: nthub
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nthub']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
  objectstore:
    image: dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ['/garage','server','--single-node','--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Execute pnpm setup:local}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Execute pnpm setup:local}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-nthub-documents}
    ports: ['127.0.0.1:9000:3900']
    volumes: ['./.runtime/garage.toml:/etc/garage.toml:ro','objectstore-data:/var/lib/garage']
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ['127.0.0.1:1025:1025','127.0.0.1:8025:8025']
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
    volumes: ['mail-data:/data']
volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  mail-data:
